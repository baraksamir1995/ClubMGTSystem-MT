# Builds the gym-admin image on GitHub's runners and publishes it to GHCR.
#
# Why: `next build` peaks around 1.1GB RSS, and the prod EC2 box (t3.small,
# 1.9GB total, prod containers resident) has roughly 600MB available. Coolify
# builds images ON that box, so every gym-admin deploy raced the OOM killer
# and lost — three consecutive failures on 2026-09-02, each dying at
# `[builder 5/5] RUN npm run build` with exit 255 and no error in the log.
# Lowering the V8 heap cap and raising vm.swappiness did not help, because
# the constraint is total box headroom, not V8's ceiling.
#
# Coolify is switched to pull `:latest` from GHCR instead of building, so the
# prod box only ever pulls a finished image.
name: build gym-admin

on:
  push:
    branches: [main]
    paths:
      - 'gym-admin/**'
      - '.github/workflows/build-gym-admin.yml'
  # Allows rebuilding the image without an app change (e.g. after a base
  # image security update).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase image name; the repo owner is mixed case.
  IMAGE_NAME: ${{ github.repository_owner }}/clby-gym-admin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name
        id: img
        # tr rather than bash's ${VAR@L}: that needs bash 4+, and this
        # should not silently depend on the runner image's shell version.
        run: echo "name=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gym-admin
          file: ./gym-admin/Dockerfile
          push: true
          # :latest is what Coolify pulls; the SHA tag makes it possible to
          # identify and roll back to an exact commit's image.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          # GitHub Actions cache keeps npm ci + the build off the critical
          # path on unchanged layers; the prod box used to spend 318s on
          # `npm ci` alone.
          cache-from: type=gha
          cache-to: type=gha,mode=max
