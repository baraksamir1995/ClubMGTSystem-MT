# nginx vhost for the Laravel API. Single port (8080) facing Coolify.
# Static assets are served straight off disk; everything else hits PHP-FPM
# over the unix socket configured in docker/php-fpm/www.conf.

server {
    listen      8080 default_server;
    server_name _;

    root  /app/public;
    index index.php;

    # Allow generous body sizes so banner/photo uploads don't 413 before
    # they reach Laravel's own validation.
    client_max_body_size 25m;

    # Long-lived keepalive — Coolify's reverse proxy holds one connection
    # to nginx and reuses it across many client requests.
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Compress text responses; binary payloads (images, ipas) are skipped.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript;

    # Hide nginx version string.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
        # Bigger buffers for typical Laravel JSON responses + member /
        # session list endpoints that can return a few hundred KB.
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # Don't serve hidden files (.env, .git, etc).
    location ~ /\. {
        deny all;
    }
}
