; PHP-FPM pool config tuned for a small-to-mid Coolify deployment.
;
; pm = dynamic so idle workers shrink off-peak; pm.max_children caps the
; total worker count and therefore the upper bound on Postgres
; connections held open by this app (each worker keeps one persistent
; PDO connection per `config/database.php` `PDO::ATTR_PERSISTENT`).
;
; Postgres default max_connections = 100. With pm.max_children = 25 we
; leave headroom for psql consoles, migrations, and a future second
; container — adjust upward only when load demands AND Postgres
; max_connections has been raised proportionally.

[www]
user  = www-data
group = www-data

listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = dynamic
pm.max_children      = 25
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Slow-log anything taking >2s so we can spot DB starvation early.
request_slowlog_timeout = 2s
slowlog = /proc/self/fd/2

; Forward stderr to the container log stream so Coolify ingests it.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
