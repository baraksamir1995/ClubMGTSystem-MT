; supervisord runs both daemons in the foreground so the container stays
; alive while either keeps running. If either crashes, supervisor exits
; non-zero and Coolify restarts the container.

[supervisord]
nodaemon = true
user     = root
loglevel = info

; PHP-FPM master — manages the worker pool defined in
; docker/php-fpm/www.conf. -F runs in foreground so supervisor sees it.
[program:php-fpm]
command         = /usr/local/sbin/php-fpm -F
autostart       = true
autorestart     = true
priority        = 5
stdout_logfile  = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile  = /dev/stderr
stderr_logfile_maxbytes = 0

; nginx — needs daemon off; to stay in foreground.
[program:nginx]
command         = /usr/sbin/nginx -g "daemon off;"
autostart       = true
autorestart     = true
priority        = 10
stdout_logfile  = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile  = /dev/stderr
stderr_logfile_maxbytes = 0

; Laravel queue worker — processes the database queue (push notification
; fan-outs, anything else dispatched via ShouldQueue). --max-time=3600
; recycles the process every hour to drop any leaked memory; --max-jobs
; does the same after 1000 jobs. stopwaitsecs lets the current job
; finish on container shutdown so we don't half-deliver a push batch.
; user=www-data: must match the FPM pool user — if this worker ran as root
; it would recreate storage/logs/laravel.log root-owned whenever the file
; is missing, and every FPM append would then fail with EACCES.
[program:queue-worker]
command         = php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
user            = www-data
autostart       = true
autorestart     = true
priority        = 20
stdout_logfile  = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile  = /dev/stderr
stderr_logfile_maxbytes = 0
stopwaitsecs    = 3600
