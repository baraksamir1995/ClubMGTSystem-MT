; supervisord runs both daemons in the foreground so the container stays
; alive while either keeps running. If either crashes, supervisor exits
; non-zero and Coolify restarts the container.

[supervisord]
nodaemon = true
user     = root
loglevel = info

; PHP-FPM master — manages the worker pool defined in
; docker/php-fpm/www.conf. -F runs in foreground so supervisor sees it.
[program:php-fpm]
command         = /usr/local/sbin/php-fpm -F
autostart       = true
autorestart     = true
priority        = 5
stdout_logfile  = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile  = /dev/stderr
stderr_logfile_maxbytes = 0

; nginx — needs daemon off; to stay in foreground.
[program:nginx]
command         = /usr/sbin/nginx -g "daemon off;"
autostart       = true
autorestart     = true
priority        = 10
stdout_logfile  = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile  = /dev/stderr
stderr_logfile_maxbytes = 0
