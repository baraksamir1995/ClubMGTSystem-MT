name: coachesapp
description: "Coachesapp — CLBY coach mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # Utils
  intl: ^0.20.2

  # Fonts (Bebas Neue / Geist / Geist Mono per CLBY Coach design)
  google_fonts: ^6.2.1
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.2.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
