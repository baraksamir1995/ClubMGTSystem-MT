name: clby
description: "CLBY — gym member mobile app"
publish_to: 'none'
version: 1.0.3+14

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # Sharing
  share_plus: ^10.1.4

  # QR screenshot / screen-recording protection
  screen_protector: ^1.5.1

  # Firebase / Push notifications / Analytics
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # Payment
  webview_flutter: ^4.10.0

  # Utils
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Deep links (password reset, email verify)
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

# Launcher icons + native splash are configured per-flavor — see
# flutter_launcher_icons-<flavor>.yaml and flutter_native_splash-<flavor>.yaml.
# clby's app-icon assets are committed (Android: android/app/src/clby/res/mipmap-*;
# iOS: ios/Runner/Assets.xcassets/AppIcon.appiconset) and don't need regeneration.

flutter:
  uses-material-design: true
  assets:
    - assets/
